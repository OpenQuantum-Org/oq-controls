name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so tag builds can create the GitHub release.
permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suites
        run: |
          python tests/test_dispenser.py
          python tests/test_probe.py
          python tests/smoke_ui.py

  build:
    # Executables are built on tags (v*) and manual dispatch; every push
    # still runs the test job above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: OpenQuantumControls-macos
          - os: ubuntu-24.04
            artifact: OpenQuantumControls-linux
          - os: windows-latest
            artifact: OpenQuantumControls-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Run test suites
        shell: bash
        run: |
          python tests/test_dispenser.py
          python tests/test_probe.py
          python tests/smoke_ui.py
      - name: Build with PyInstaller
        run: pyinstaller OpenQuantumControls.spec --noconfirm
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/OpenQuantumControls.app ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist OpenQuantumControls
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a ${{ matrix.artifact }}.zip ./dist/OpenQuantumControls
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*
